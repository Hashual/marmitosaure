services : 
  frontend :
    container_name: frontend_marmitosaure
    build :
      context : ./frontend
    ports :
      - "3000:3000"
    volumes :
      - ./frontend:/app
    depends_on :
      - backend
    command : sh -c "npm install && npm run dev"

  backend :
    container_name : backend_marmitosaure
    build :
      context : ./backend
    volumes :
      - ./backend:/app
    ports :
      - "5000:5000"
    command : sh -c "npm install && npm run dev"
